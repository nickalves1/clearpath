sonar.projectKey=clearpath
sonar.projectName=Clearpath
sonar.sourceEncoding=UTF-8

sonar.sources=app,resources/js
sonar.tests=tests,resources/js
sonar.test.inclusions=tests/**/*.php,resources/js/**/*.test.ts,resources/js/**/*.test.tsx

sonar.exclusions=resources/js/routes/**,resources/js/actions/**,resources/js/wayfinder/**,resources/js/components/ui/**,vendor/**,node_modules/**

# Coverage reports aren't generated yet (PHPUnit needs Xdebug/PCOV enabled,
# Vitest needs @vitest/coverage-v8 installed) — these paths are wired up for
# when that's added later.
sonar.php.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info
