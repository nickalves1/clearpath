services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            DB_HOST: pgsql
            REDIS_HOST: redis
            ELASTICSEARCH_HOST: http://elasticsearch:9200
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            - 'sail-node-modules:/var/www/html/node_modules'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
            - elasticsearch
    # Processes queued Listeners (patient audit events) so `docker compose up -d`
    # alone is a complete way to run the app, no `composer run dev` required.
    # Same image as laravel.test, just a different entrypoint.
    queue:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        command: ['php', 'artisan', 'queue:listen', '--tries=1', '--timeout=0']
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            DB_HOST: pgsql
            REDIS_HOST: redis
            ELASTICSEARCH_HOST: http://elasticsearch:9200
        volumes:
            - '.:/var/www/html'
            - 'sail-node-modules:/var/www/html/node_modules'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
            - elasticsearch
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:8-alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    # Runs by default, like pgsql/redis — logging itself needs this up.
    # Kibana (below) is just a viewer on top of it and stays on-demand.
    elasticsearch:
        image: 'docker.elastic.co/elasticsearch/elasticsearch:9.5.0'
        environment:
            discovery.type: single-node
            xpack.security.enabled: 'false'
            ES_JAVA_OPTS: '-Xms512m -Xmx512m'
        ports:
            - '9200:9200'
        volumes:
            - sail-elasticsearch:/usr/share/elasticsearch/data
        networks:
            - sail
        healthcheck:
            test:
                - CMD-SHELL
                - "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"
            retries: 10
            timeout: 5s
    # On-demand only — Kibana is purely a viewer over Elasticsearch, it plays
    # no part in whether logging itself works. Start with:
    # docker compose --profile kibana up -d kibana
    kibana:
        image: 'docker.elastic.co/kibana/kibana:9.5.0'
        environment:
            ELASTICSEARCH_HOSTS: http://elasticsearch:9200
        ports:
            - '5601:5601'
        networks:
            - sail
        depends_on:
            - elasticsearch
        profiles:
            - kibana
    # On-demand only (doesn't start with `docker compose up`) — SonarQube is
    # memory-hungry, only run it while actively scanning/demoing this piece.
    # Start with: docker compose --profile sonar up -d
    sonarqube:
        image: sonarqube:community
        ports:
            - '9000:9000'
        environment:
            SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
            SONAR_JDBC_USERNAME: sonar
            SONAR_JDBC_PASSWORD: sonar
        volumes:
            - sonarqube_data:/opt/sonarqube/data
            - sonarqube_extensions:/opt/sonarqube/extensions
            - sonarqube_logs:/opt/sonarqube/logs
        networks:
            - sail
        depends_on:
            - sonarqube-db
        profiles:
            - sonar
    sonarqube-db:
        image: 'postgres:18-alpine'
        environment:
            POSTGRES_USER: sonar
            POSTGRES_PASSWORD: sonar
            POSTGRES_DB: sonar
        volumes:
            - sonarqube_db:/var/lib/postgresql
        networks:
            - sail
        profiles:
            - sonar
    # On-demand only (doesn't start with `docker compose up`).
    # Run with: docker compose --profile scan run --rm sonar-scanner -Dsonar.token=YOUR_TOKEN
    sonar-scanner:
        image: sonarsource/sonar-scanner-cli:latest
        depends_on:
            - sonarqube
        volumes:
            - '.:/usr/src'
        working_dir: /usr/src
        environment:
            SONAR_HOST_URL: http://sonarqube:9000
        networks:
            - sail
        profiles:
            - scan
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
    sail-elasticsearch:
        driver: local
    sail-node-modules:
        driver: local
    sonarqube_data:
        driver: local
    sonarqube_extensions:
        driver: local
    sonarqube_logs:
        driver: local
    sonarqube_db:
        driver: local
